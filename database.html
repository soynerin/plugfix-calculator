<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de Datos - soyNerin.tech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
    <!-- Dexie.js - Wrapper para IndexedDB -->
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
</head>
<body>
    <div id="toast-container"></div>
    
    <!-- Modal de Confirmación -->
    <div id="confirmation-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-[9999] flex items-center justify-center p-4">
        <div class="glass-card rounded-2xl p-6 max-w-md w-full animate-scale-in">
            <div class="text-center mb-6">
                <div class="mx-auto w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center mb-4">
                    <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                </div>
                <h3 class="text-xl font-bold text-white mb-2" id="modal-title">¿Estás seguro?</h3>
                <p class="text-gray-400" id="modal-message">Esta acción no se puede deshacer.</p>
            </div>
            <div class="flex gap-3">
                <button onclick="cancelConfirmation()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-semibold py-3 rounded-lg transition">
                    Cancelar
                </button>
                <button id="modal-confirm-btn" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-lg transition">
                    Eliminar
                </button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="glass-card p-4 mb-6 sticky top-0 z-50">
        <h1 class="text-3xl font-bold text-cyan-400 neon-text text-center">⚡ soyNerin.tech</h1>
        <p class="text-center text-gray-400 text-sm">Base de Datos</p>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 max-w-4xl pb-20">
        <!-- Marcas y Modelos -->
        <div class="glass-card rounded-2xl p-6 mb-6">
            <h2 class="text-2xl font-bold text-cyan-400 mb-6">📱 Marcas y Modelos</h2>
            
            <div class="mb-6">
                <h3 class="text-lg font-semibold text-white mb-3">Agregar Marca</h3>
                <input type="text" id="new-brand" class="w-full bg-slate-700 text-white p-3 rounded-lg border border-slate-600 mb-2" placeholder="Nombre de la marca">
                <button onclick="addBrand()" class="w-full btn-primary py-3 rounded-lg text-white font-bold">Agregar Marca</button>
            </div>

            <div class="mb-6">
                <h3 class="text-lg font-semibold text-white mb-3">Agregar Modelo</h3>
                <input type="text" id="model-brand-select" list="model-brand-list" class="w-full bg-slate-700 text-white p-3 rounded-lg border border-slate-600 mb-2" placeholder="Escribe o selecciona una marca..." autocomplete="off">
                <datalist id="model-brand-list"></datalist>
                <div class="flex flex-wrap gap-2 mb-2">
                    <input type="text" id="new-model-name" class="w-full md:flex-1 bg-slate-700 text-white p-3 rounded-lg border border-slate-600" placeholder="Nombre del modelo">
                    <select id="new-model-risk" class="w-full md:w-auto bg-slate-700 text-white p-3 rounded-lg border border-slate-600">
                        <option value="1.0">Gama Baja (1.0x)</option>
                        <option value="1.2">Gama Media (1.2x)</option>
                        <option value="1.5">Gama Alta (1.5x)</option>
                        <option value="2.0">Premium (2.0x)</option>
                    </select>
                </div>
                <button onclick="addModel()" class="w-full btn-primary py-3 rounded-lg text-white font-bold">Agregar Modelo</button>
            </div>

            <!-- Barra de Herramientas -->
            <div class="flex flex-col md:flex-row gap-3 mb-4">
                <!-- Input de Búsqueda (70%) -->
                <div class="relative w-full md:flex-[7]">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                    </div>
                    <input 
                        type="text" 
                        id="search-brands" 
                        class="w-full bg-slate-700 text-white pl-10 pr-4 py-3 rounded-lg border border-slate-600 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/20 transition" 
                        placeholder="Buscar marca o modelo..."
                        oninput="handleSearchAndSort()"
                        autocomplete="off"
                    >
                </div>
                
                <!-- Dropdown de Ordenamiento (30%) -->
                <div class="w-full md:flex-[3]">
                    <select 
                        id="sort-brands" 
                        class="w-full bg-slate-700 text-white px-4 py-3 rounded-lg border border-slate-600 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/20 transition cursor-pointer"
                        onchange="handleSearchAndSort()"
                    >
                        <option value="name-asc">Nombre (A-Z)</option>
                        <option value="name-desc">Nombre (Z-A)</option>
                        <option value="complexity-desc">Mayor Complejidad</option>
                        <option value="complexity-asc">Menor Complejidad</option>
                    </select>
                </div>
            </div>

            <!-- Acordeón de Marcas y Modelos -->
            <div id="brands-list" class="space-y-3">
                <p class="text-gray-500 text-center py-8">No hay marcas registradas</p>
            </div>
        </div>

        <!-- Servicios -->
        <div class="glass-card rounded-2xl p-6">
            <h2 class="text-2xl font-bold text-cyan-400 mb-6">🔧 Servicios</h2>
            
            <div class="mb-6">
                <div class="space-y-2">
                    <input type="text" id="new-service-name" class="w-full bg-slate-700 text-white p-3 rounded-lg border border-slate-600" placeholder="Nombre del servicio">
                    <input type="number" step="0.5" id="new-service-hours" class="w-full bg-slate-700 text-white p-3 rounded-lg border border-slate-600" placeholder="Horas estimadas">
                    <button onclick="addService()" class="w-full btn-primary py-3 rounded-lg text-white font-bold">Agregar Servicio</button>
                </div>
            </div>

            <!-- Grid de Servicios -->
            <div id="services-list" class="services-grid">
                <div class="text-gray-500 text-center py-8 col-span-2">No hay servicios registrados</div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 glass-card border-t border-slate-700 z-50">
        <div class="flex justify-around">
            <a href="index.html" class="tab-btn flex-1 py-3 text-center" data-tab="calculator">
                <div class="text-xl mb-0.5">💰</div>
                <div class="text-[10px] text-gray-300 leading-tight">Calculadora</div>
            </a>
            <a href="database.html" class="tab-btn tab-active flex-1 py-3 text-center" data-tab="database">
                <div class="text-xl mb-0.5">📱</div>
                <div class="text-[10px] text-gray-300 leading-tight">Base de Datos</div>
            </a>
            <a href="config.html" class="tab-btn flex-1 py-3 text-center" data-tab="config">
                <div class="text-xl mb-0.5">⚙️</div>
                <div class="text-[10px] text-gray-300 leading-tight">Configuración</div>
            </a>
        </div>
    </nav>

    <script src="app.js"></script>
    <script type="module">
        import { useDB, initializeDB } from './database/databaseProvider.js';
        
        // Instancia de la base de datos
        let db;
        
        // Estado persistente de acordeones expandidos
        let expandedBrandIds = new Set();
        
        // Sistema de Modal de Confirmación
        let confirmCallback = null;

        window.showConfirmation = function(title, message, onConfirm, confirmText = 'Eliminar') {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            document.getElementById('modal-confirm-btn').textContent = confirmText;
            document.getElementById('confirmation-modal').classList.remove('hidden');
            confirmCallback = onConfirm;
        }

        window.cancelConfirmation = function() {
            document.getElementById('confirmation-modal').classList.add('hidden');
            confirmCallback = null;
        }

        document.getElementById('modal-confirm-btn').addEventListener('click', () => {
            if (confirmCallback) {
                confirmCallback();
                cancelConfirmation();
            }
        });

        // Cerrar modal al hacer clic fuera
        document.getElementById('confirmation-modal').addEventListener('click', (e) => {
            if (e.target.id === 'confirmation-modal') {
                cancelConfirmation();
            }
        });

        // Toast notifications
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast glass-card rounded-lg p-4 ${type === 'success' ? 'border-l-4 border-green-500' : 'border-l-4 border-red-500'}`;
            toast.innerHTML = `<p class="text-white font-medium">${message}</p>`;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // BASE DE DATOS
        async function renderDatabase() {
            try {
                // Obtener todas las marcas
                const brands = await db.getAllBrands();
                
                // Actualizar datalist de marcas para modelos
                const modelBrandList = document.getElementById('model-brand-list');
                modelBrandList.innerHTML = '';
                brands.forEach(brand => {
                    const option = document.createElement('option');
                    option.value = brand.name;
                    option.dataset.id = brand.id;
                    modelBrandList.appendChild(option);
                });

                await renderBrandsList();
                await renderServicesList();
            } catch (error) {
                console.error('Error al renderizar base de datos:', error);
                showToast('Error al cargar datos', 'error');
            }
        }

        window.addBrand = async function() {
            const name = document.getElementById('new-brand').value.trim();
            if (!name) {
                showToast('Ingresa el nombre de la marca', 'error');
                return;
            }

            try {
                await db.addBrand({ name });
                document.getElementById('new-brand').value = '';
                await renderDatabase();
                showToast('Marca agregada');
            } catch (error) {
                console.error('Error al agregar marca:', error);
                showToast('Error al agregar marca', 'error');
            }
        }

        window.addModel = async function() {
            const brandValue = document.getElementById('model-brand-select').value;
            const name = document.getElementById('new-model-name').value.trim();
            const riskFactor = parseFloat(document.getElementById('new-model-risk').value);

            if (!brandValue || !name) {
                showToast('Completa todos los campos', 'error');
                return;
            }

            try {
                // Buscar la marca por nombre
                const brands = await db.getAllBrands();
                const brand = brands.find(b => b.name === brandValue);
                
                if (!brand) {
                    showToast('Marca no válida', 'error');
                    return;
                }

                // Verificar si el modelo ya existe
                const existingModels = await db.getModelsByBrand(brand.id);
                const modelId = name.toLowerCase().replace(/\s+/g, '-');
                
                if (existingModels.find(m => m.id === modelId)) {
                    showToast('Este modelo ya existe', 'error');
                    return;
                }

                await db.addModel({ name, brandId: brand.id, riskFactor });
                document.getElementById('new-model-name').value = '';
                await renderDatabase();
                showToast('Modelo agregado');
            } catch (error) {
                console.error('Error al agregar modelo:', error);
                showToast('Error al agregar modelo', 'error');
            }
        }

        window.deleteBrand = async function(brandId) {
            try {
                const brand = await db.getBrandById(brandId);
                if (!brand) return;
                
                showConfirmation(
                    '¿Eliminar marca completa?',
                    `Se eliminará "${brand.name}" y todos sus modelos. Esta acción no se puede deshacer.`,
                    async () => {
                        try {
                            await db.deleteBrand(brandId);
                            await renderDatabase();
                            showToast('Marca eliminada');
                        } catch (error) {
                            console.error('Error al eliminar marca:', error);
                            showToast('Error al eliminar marca', 'error');
                        }
                    }
                );
            } catch (error) {
                console.error('Error:', error);
            }
        }

        window.deleteModel = async function(brandId, modelId) {
            try {
                const brand = await db.getBrandById(brandId);
                const model = await db.getModelById(modelId);
                
                if (!brand || !model) return;
                
                showConfirmation(
                    '¿Eliminar modelo?',
                    `Se eliminará "${model.name}" de ${brand.name}.`,
                    async () => {
                        try {
                            await db.deleteModel(modelId);
                            await renderDatabase();
                            showToast('Modelo eliminado');
                        } catch (error) {
                            console.error('Error al eliminar modelo:', error);
                            showToast('Error al eliminar modelo', 'error');
                        }
                    }
                );
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function renderBrandsList(searchTerm = '', sortOption = 'name-asc') {
            const brandsList = document.getElementById('brands-list');
            
            try {
                const brands = await db.getAllBrands();
                
                if (brands.length === 0) {
                    brandsList.innerHTML = '<p class="text-gray-500 text-center py-8">No hay marcas registradas</p>';
                    return;
                }
                
                // Obtener modelos para cada marca
                let brandsWithModels = await Promise.all(
                    brands.map(async (brand) => {
                        let models = await db.getModelsByBrand(brand.id);
                        
                        // Aplicar ordenamiento a los modelos
                        models = sortModels(models, sortOption);
                        
                        return { ...brand, models };
                    })
                );
                
                // Filtrar marcas y modelos según búsqueda
                const searchLower = searchTerm.toLowerCase().trim();
                let filteredBrands = brandsWithModels;
                
                if (searchLower) {
                    filteredBrands = brandsWithModels.map(brand => {
                        // Filtrar modelos que coincidan con la búsqueda
                        const matchingModels = brand.models.filter(model => 
                            model.name.toLowerCase().includes(searchLower)
                        );
                        
                        // Solo incluir la marca si tiene modelos coincidentes o si el nombre de la marca coincide
                        if (matchingModels.length > 0 || brand.name.toLowerCase().includes(searchLower)) {
                            return { ...brand, models: matchingModels.length > 0 ? matchingModels : brand.models };
                        }
                        return null;
                    }).filter(brand => brand !== null);
                }
                
                // Mostrar estado vacío si no hay resultados
                if (filteredBrands.length === 0) {
                    brandsList.innerHTML = `
                        <div class="text-center py-12">
                            <div class="inline-flex items-center justify-center w-20 h-20 bg-slate-700/50 rounded-full mb-4">
                                <svg class="w-10 h-10 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                                </svg>
                            </div>
                            <p class="text-gray-400 text-lg font-medium">No se encontraron modelos con ese nombre</p>
                            <p class="text-gray-500 text-sm mt-2">Intenta con otro término de búsqueda</p>
                        </div>
                    `;
                    return;
                }
                
                // Auto-expandir: si hay búsqueda activa, todos los acordeones deben abrirse
                // Si no hay búsqueda, usar el estado persistente
                const shouldExpand = (brandId) => {
                    if (searchLower !== '') {
                        return true; // Durante búsqueda, expandir todo
                    }
                    return expandedBrandIds.has(brandId); // Sin búsqueda, usar estado persistente
                };
                
                brandsList.innerHTML = filteredBrands.map((brand, index) => {
                    const accordionId = `accordion-${brand.id}`;
                    const isExpanded = shouldExpand(brand.id);
                    
                    return `
                        <div class="bg-slate-700/50 rounded-lg border border-slate-600 overflow-hidden" data-brand-id="${brand.id}">
                            <!-- Cabecera del Acordeón -->
                            <div class="flex items-center justify-between p-4 cursor-pointer hover:bg-slate-700/70 transition" onclick="toggleAccordion('${accordionId}', '${brand.id}')">
                                <div class="flex items-center gap-3 flex-1">
                                    <svg id="icon-${accordionId}" class="w-5 h-5 text-cyan-400 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="${isExpanded ? 'transform: rotate(90deg);' : ''}">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                                    </svg>
                                    <h4 class="text-white font-bold text-lg">${brand.name}</h4>
                                    <span class="inline-block bg-cyan-500/20 text-cyan-400 rounded-full px-3 py-1 text-xs font-semibold">
                                        ${brand.models.length} ${brand.models.length === 1 ? 'Modelo' : 'Modelos'}
                                    </span>
                                </div>
                                <div class="flex items-center gap-2" onclick="event.stopPropagation()">
                                    <button onclick="deleteBrand('${brand.id}')" class="delete-btn-brand text-red-500 hover:text-red-400 hover:bg-red-500/10 p-2 rounded-lg transition" title="Eliminar marca completa">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Contenido Expandible -->
                            <div id="${accordionId}" class="accordion-content ${isExpanded ? '' : 'max-h-0'} overflow-hidden transition-all duration-300" style="${isExpanded ? 'max-height: 2000px;' : 'max-height: 0;'}">
                                <div class="p-4 pt-0 border-t border-slate-600">
                                    ${brand.models.length > 0 ? `
                                        <div class="models-grid">
                                            ${brand.models.map(model => {
                                                // Determinar color y texto del badge según el factor de riesgo
                                                let badgeClass = '';
                                                let badgeText = '';
                                                
                                                if (model.riskFactor <= 1.0) {
                                                    badgeClass = 'badge-low';
                                                    badgeText = 'Gama Baja';
                                                } else if (model.riskFactor <= 1.2) {
                                                    badgeClass = 'badge-medium';
                                                    badgeText = 'Gama Media';
                                                } else if (model.riskFactor <= 1.5) {
                                                    badgeClass = 'badge-high';
                                                    badgeText = 'Gama Alta';
                                                } else {
                                                    badgeClass = 'badge-premium';
                                                    badgeText = 'Premium';
                                                }
                                                
                                                return `
                                                    <div class="model-mini-card">
                                                        <button onclick="deleteModel('${brand.id}', '${model.id}')" class="model-delete-btn" title="Eliminar modelo">
                                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                                            </svg>
                                                        </button>
                                                        <div class="model-content">
                                                            <h5 class="model-name">${model.name}</h5>
                                                            <div class="flex items-center gap-2 mt-2">
                                                                <span class="model-badge ${badgeClass}">${badgeText}</span>
                                                                <span class="text-gray-500 text-xs font-mono">${model.riskFactor}x</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                `;
                                            }).join('')}
                                        </div>
                                    ` : '<p class="text-gray-500 text-sm text-center mt-3">No hay modelos en esta marca</p>'}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error al renderizar marcas:', error);
                brandsList.innerHTML = '<p class="text-red-500 text-center py-8">Error al cargar las marcas</p>';
            }
        }
        
        window.toggleAccordion = function(accordionId, brandId) {
            const content = document.getElementById(accordionId);
            const icon = document.getElementById(`icon-${accordionId}`);
            
            if (content.style.maxHeight && content.style.maxHeight !== '0px') {
                // Cerrar
                content.style.maxHeight = '0px';
                icon.style.transform = 'rotate(0deg)';
                expandedBrandIds.delete(brandId); // Remover del estado
            } else {
                // Abrir
                content.style.maxHeight = content.scrollHeight + 'px';
                icon.style.transform = 'rotate(90deg)';
                expandedBrandIds.add(brandId); // Agregar al estado
            }
        }

        // Función de ordenamiento de modelos
        function sortModels(models, sortOption) {
            const sorted = [...models];
            
            switch(sortOption) {
                case 'name-asc':
                    return sorted.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
                
                case 'name-desc':
                    return sorted.sort((a, b) => b.name.localeCompare(a.name, undefined, { numeric: true, sensitivity: 'base' }));
                
                case 'complexity-desc': // Mayor complejidad (Premium primero)
                    return sorted.sort((a, b) => b.riskFactor - a.riskFactor);
                
                case 'complexity-asc': // Menor complejidad (Económico primero)
                    return sorted.sort((a, b) => a.riskFactor - b.riskFactor);
                
                default:
                    return sorted;
            }
        }
        
        // Sistema de búsqueda y ordenamiento reactivo
        let searchTimeout;
        window.handleSearchAndSort = function() {
            clearTimeout(searchTimeout);
            
            searchTimeout = setTimeout(async () => {
                const searchTerm = document.getElementById('search-brands').value;
                const sortOption = document.getElementById('sort-brands').value;
                await renderBrandsList(searchTerm, sortOption);
            }, 200); // Debounce de 200ms
        }

        window.addService = async function() {
            const name = document.getElementById('new-service-name').value.trim();
            const hours = parseFloat(document.getElementById('new-service-hours').value);

            if (!name || !hours || hours <= 0) {
                showToast('Completa todos los campos correctamente', 'error');
                return;
            }

            try {
                await db.addService({ name, hours });
                document.getElementById('new-service-name').value = '';
                document.getElementById('new-service-hours').value = '';
                await renderDatabase();
                showToast('Servicio agregado');
            } catch (error) {
                console.error('Error al agregar servicio:', error);
                showToast('Error al agregar servicio', 'error');
            }
        }

        window.deleteService = async function(serviceId) {
            try {
                const service = await db.getServiceById(serviceId);
                if (!service) return;
                
                showConfirmation(
                    '¿Eliminar servicio?',
                    `Se eliminará "${service.name}" de la lista de servicios.`,
                    async () => {
                        try {
                            await db.deleteService(serviceId);
                            await renderDatabase();
                            showToast('Servicio eliminado');
                        } catch (error) {
                            console.error('Error al eliminar servicio:', error);
                            showToast('Error al eliminar servicio', 'error');
                        }
                    }
                );
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function renderServicesList() {
            const servicesList = document.getElementById('services-list');
            
            try {
                const services = await db.getAllServices();
                
                if (services.length === 0) {
                    servicesList.innerHTML = '<div class="text-gray-500 text-center py-8 col-span-2">No hay servicios registrados</div>';
                    return;
                }
                
                servicesList.innerHTML = services.map(service => `
                    <div class="service-mini-card">
                        <button onclick="deleteService('${service.id}')" class="service-delete-btn" title="Eliminar servicio">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                        </button>
                        <div class="flex items-center justify-between gap-4">
                            <h3 class="service-name">${service.name}</h3>
                            <div class="service-hours-badge">
                                <div class="hours-number">${service.hours}</div>
                                <div class="hours-label">horas</div>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error al renderizar servicios:', error);
                servicesList.innerHTML = '<div class="text-red-500 text-center py-8 col-span-2">Error al cargar servicios</div>';
            }
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Inicializar la base de datos
                await initializeDB();
                db = useDB();
                
                // Set active tab (función de app.js)
                if (typeof setActiveTab === 'function') {
                    setActiveTab('database');
                }
                
                // Renderizar datos
                await renderDatabase();
                
                console.log('✅ Base de datos inicializada correctamente');
            } catch (error) {
                console.error('❌ Error al inicializar:', error);
                showToast('Error al inicializar la base de datos', 'error');
            }
        });
    </script>
</body>
</html>
