<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración - soyNerin.tech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
    <!-- Dexie.js - Wrapper para IndexedDB -->
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
</head>
<body>
    <div id="toast-container"></div>
    
    <!-- Modal de Confirmación -->
    <div id="confirmation-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-[9999] flex items-center justify-center p-4">
        <div class="glass-card rounded-2xl p-6 max-w-md w-full animate-scale-in">
            <div class="text-center mb-6">
                <div class="mx-auto w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center mb-4">
                    <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                </div>
                <h3 class="text-xl font-bold text-white mb-2" id="modal-title">¿Estás seguro?</h3>
                <p class="text-gray-400" id="modal-message">Esta acción no se puede deshacer.</p>
            </div>
            <div class="flex gap-3">
                <button onclick="cancelConfirmation()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-semibold py-3 rounded-lg transition">
                    Cancelar
                </button>
                <button id="modal-confirm-btn" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-lg transition">
                    Resetear
                </button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="glass-card p-4 mb-6 sticky top-0 z-50">
        <h1 class="neon-text text-center text-cyan-400">⚡ soyNerin.tech</h1>
        <p class="text-center text-gray-400 text-sm">Configuración</p>
    </header>

    <!-- Main Content -->
    <main class="page-container">
        <div class="card-container">
            <h2 class="text-cyan-400 page-title">⚙️ Configuración Financiera</h2>
            
            <div class="space-y-6">
                <div class="space-y-element">
                    <label class="block text-gray-300 mb-2 font-medium">💼 Valor Hora Técnica (ARS)</label>
                    <input type="number" id="config-hourly-rate" class="input-lg" placeholder="13000">
                </div>

                <div class="space-y-element">
                    <label class="block text-gray-300 mb-2 font-medium">📈 Margen sobre Repuesto (%)</label>
                    <input type="number" id="config-margin" class="input-lg" placeholder="40">
                    <p class="text-gray-500 text-sm mt-1">Ej: 40% de ganancia sobre el costo</p>
                </div>

                <div class="space-y-element">
                    <label class="block text-gray-300 mb-2 font-medium">💵 Cotización Dólar (USD a ARS)</label>
                    <div class="flex gap-2">
                        <input type="number" id="config-usd-rate" class="input-lg flex-1" placeholder="1200">
                        <button onclick="forceRefreshDolar()" class="bg-slate-700 hover:bg-slate-600 px-4 rounded-lg transition flex items-center justify-center" title="Actualizar cotización">
                            <svg id="refresh-icon" class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                            </svg>
                        </button>
                    </div>
                    <p id="dolar-status" class="text-gray-500 text-sm mt-1">💡 Cargando cotización automática...</p>
                </div>

                <button onclick="saveConfig()" class="w-full btn btn-primary mt-4">
                    💾 GUARDAR CONFIGURACIÓN
                </button>

                <div class="border-t border-slate-600 pt-6 mt-6">
                    <h3 class="text-red-400 mb-3">🗑️ Zona de Peligro</h3>
                    <button onclick="confirmResetAll()" class="w-full btn btn-danger">
                        Resetear Toda la Aplicación
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 glass-card border-t border-slate-700">
        <div class="flex justify-around">
            <a href="index.html" class="tab-btn flex-1 py-3 text-center" data-tab="calculator">
                <div class="text-xl mb-0.5">💰</div>
                <div class="text-[10px] text-gray-300 leading-tight">Calculadora</div>
            </a>
            <a href="database.html" class="tab-btn flex-1 py-3 text-center" data-tab="database">
                <div class="text-xl mb-0.5">📱</div>
                <div class="text-[10px] text-gray-300 leading-tight">Base de Datos</div>
            </a>
            <a href="config.html" class="tab-btn tab-active flex-1 py-3 text-center" data-tab="config">
                <div class="text-xl mb-0.5">⚙️</div>
                <div class="text-[10px] text-gray-300 leading-tight">Configuración</div>
            </a>
        </div>
    </nav>

    <script src="app.js"></script>
    <script type="module">
        import { useDB, initializeDB } from './database/databaseProvider.js';
        
        // Instancia de la base de datos
        let db;
        
        // Sistema de Modal de Confirmación
        let confirmCallback = null;

        window.showConfirmation = function(title, message, onConfirm, confirmText = 'Eliminar') {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            document.getElementById('modal-confirm-btn').textContent = confirmText;
            document.getElementById('confirmation-modal').classList.remove('hidden');
            confirmCallback = onConfirm;
        }

        window.cancelConfirmation = function() {
            document.getElementById('confirmation-modal').classList.add('hidden');
            confirmCallback = null;
        }

        document.getElementById('modal-confirm-btn').addEventListener('click', () => {
            if (confirmCallback) {
                confirmCallback();
                cancelConfirmation();
            }
        });

        // Cerrar modal al hacer clic fuera
        document.getElementById('confirmation-modal').addEventListener('click', (e) => {
            if (e.target.id === 'confirmation-modal') {
                cancelConfirmation();
            }
        });

        // CONFIGURACIÓN
        async function renderConfig() {
            try {
                const config = await db.getConfig();
                document.getElementById('config-hourly-rate').value = config.hourlyRate;
                document.getElementById('config-margin').value = config.margin;
                document.getElementById('config-usd-rate').value = config.usdRate;
                
                // Intentar obtener cotización automática del dólar
                await fetchDolarValue();
            } catch (error) {
                console.error('Error al cargar configuración:', error);
                // Valores por defecto si hay error
                document.getElementById('config-hourly-rate').value = 13000;
                document.getElementById('config-margin').value = 40;
                document.getElementById('config-usd-rate').value = 1200;
                updateDolarStatus('manual', null);
            }
        }

        // Obtener fecha actual en formato YYYY-MM-DD
        function getTodayDate() {
            const today = new Date();
            return today.toISOString().split('T')[0];
        }

        // Actualizar mensaje de estado del dólar
        function updateDolarStatus(type, date) {
            const statusElement = document.getElementById('dolar-status');
            if (type === 'auto') {
                statusElement.textContent = `✅ Actualizado automáticamente: ${date}`;
                statusElement.className = 'text-green-400 text-sm mt-1';
            } else if (type === 'cached') {
                statusElement.textContent = `💾 Usando valor en cache (${date})`;
                statusElement.className = 'text-cyan-400 text-sm mt-1';
            } else if (type === 'error') {
                statusElement.textContent = '⚠️ Error en API. Usando último valor conocido';
                statusElement.className = 'text-yellow-400 text-sm mt-1';
            } else {
                statusElement.textContent = '💡 Cotización manual';
                statusElement.className = 'text-gray-500 text-sm mt-1';
            }
        }

        // Función para obtener cotización del Dólar Blue con cache diario
        async function fetchDolarValue(forceRefresh = false) {
            const today = getTodayDate();
            const cachedPrice = localStorage.getItem('cachedDolarPrice');
            const lastFetchDate = localStorage.getItem('lastFetchDate');
            const inputElement = document.getElementById('config-usd-rate');

            // Si hay cache del mismo día y no es refresh forzado, usar cache
            if (!forceRefresh && lastFetchDate === today && cachedPrice) {
                console.log('📦 Usando cotización en cache:', cachedPrice);
                inputElement.value = cachedPrice;
                updateDolarStatus('cached', today);
                return;
            }

            // Si es refresh forzado, animar el ícono
            if (forceRefresh) {
                const refreshIcon = document.getElementById('refresh-icon');
                refreshIcon.classList.add('animate-spin');
            }

            try {
                console.log('🌐 Consultando API de Dólar Blue...');
                const response = await fetch('https://dolarapi.com/v1/dolares/blue');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                const dolarVenta = data.venta;

                if (dolarVenta && !isNaN(dolarVenta)) {
                    // Actualizar input
                    inputElement.value = dolarVenta;
                    
                    // Guardar en cache
                    localStorage.setItem('cachedDolarPrice', dolarVenta);
                    localStorage.setItem('lastFetchDate', today);
                    
                    // Actualizar estado visual
                    updateDolarStatus('auto', today);
                    
                    // Guardar automáticamente en la configuración
                    await window.saveConfig();
                    
                    console.log('✅ Cotización actualizada:', dolarVenta);
                    
                    if (forceRefresh) {
                        showToast(`Dólar Blue actualizado: $${dolarVenta}`);
                    }
                } else {
                    throw new Error('Valor de venta inválido');
                }
            } catch (error) {
                console.error('❌ Error al obtener cotización del dólar:', error);
                
                // Si hay un valor en cache antiguo, usarlo
                if (cachedPrice) {
                    inputElement.value = cachedPrice;
                    updateDolarStatus('error', lastFetchDate || 'desconocida');
                } else {
                    updateDolarStatus('manual', null);
                }
                
                if (forceRefresh) {
                    showToast('Error al actualizar cotización', 'error');
                }
            } finally {
                // Detener animación del ícono
                if (forceRefresh) {
                    const refreshIcon = document.getElementById('refresh-icon');
                    refreshIcon.classList.remove('animate-spin');
                }
            }
        }

        // Función para forzar actualización manual
        window.forceRefreshDolar = async function() {
            await fetchDolarValue(true);
        }

        window.saveConfig = async function() {
            const config = {
                hourlyRate: parseFloat(document.getElementById('config-hourly-rate').value) || 13000,
                margin: parseFloat(document.getElementById('config-margin').value) || 40,
                usdRate: parseFloat(document.getElementById('config-usd-rate').value) || 1200
            };
            
            try {
                await db.updateConfig(config);
                showToast('Configuración guardada');
            } catch (error) {
                console.error('Error al guardar configuración:', error);
                showToast('Error al guardar configuración', 'error');
            }
        }

        window.resetAll = async function() {
            try {
                // 1. Destruir completamente la base de datos IndexedDB
                await db.db.delete();
                console.log('✅ Base de datos eliminada');
                
                // 2. Limpiar localStorage (por si quedó basura vieja)
                localStorage.clear();
                console.log('✅ LocalStorage limpiado');
                
                // 3. Marcar migración como completada para evitar que se migren datos viejos
                localStorage.setItem('plugfix_migration_completed', 'true');
                console.log('✅ Flag de migración establecido');
                
                // 4. Recargar la página para que el seeding se ejecute de nuevo
                window.location.reload();
            } catch (error) {
                console.error('❌ Error al resetear la aplicación:', error);
                showToast('Error al resetear la aplicación', 'error');
            }
        }

        window.confirmResetAll = function() {
            showConfirmation(
                '⚠️ ¿Resetear TODO?',
                'Se borrarán TODOS los datos: marcas, modelos, servicios, configuración e historial. Esta acción es IRREVERSIBLE.',
                resetAll,
                'Sí, resetear todo'
            );
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Inicializar la base de datos
                await initializeDB();
                db = useDB();
                
                // Set active tab (función de app.js)
                if (typeof setActiveTab === 'function') {
                    setActiveTab('config');
                }
                
                // Renderizar configuración
                await renderConfig();
                
                console.log('✅ Configuración inicializada correctamente');
            } catch (error) {
                console.error('❌ Error al inicializar:', error);
                showToast('Error al inicializar la configuración', 'error');
            }
        });
    </script>
</body>
</html>
